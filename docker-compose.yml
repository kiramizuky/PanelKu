services:
  app:
    build: .
    container_name: panelku
    restart: unless-stopped
    ports:
      - "23456:3000"   # host:container — the app listens on PORT (3000 in Docker)
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/storage/panelku.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    networks:
      - panel-net

  # Read/write Docker API proxy. The app never gets the raw socket; only the
  # API sections it needs are enabled. AUTH/SWARM/NODES/SECRETS/SYSTEM are off,
  # so host-level daemon and cluster administration stay out of reach.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: panelku-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - EXEC=1
      - INFO=1
      - VERSION=1
      - EVENTS=1
      - POST=1
      - DELETE=1
      - BUILD=1
      - SWARM=0
      - SERVICES=0
      - NODES=0
      - SECRETS=0
      - CONFIGS=0
      - PLUGINS=0
      - SYSTEM=0
      - AUTH=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - panel-net

  redis:
    image: redis:7-alpine
    container_name: panelku-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - panel-net

volumes:
  redis-data:

networks:
  panel-net:
