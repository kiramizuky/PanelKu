# ─────────────────────────────────────────────────────────────────────
# Panelku — Dependabot (automated dependency updates)
# [8.3] Security scan terjadwal: weekly npm audit + auto PRs for updates.
# ─────────────────────────────────────────────────────────────────────

version: 2
updates:
  # npm dependencies (linux-panel is the app root)
  - package-ecosystem: "npm"
    directory: "/linux-panel"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # [8.3] Auto-merge only security patches — keep major/minor as PRs for review.
    ignore:
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node-pty"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
