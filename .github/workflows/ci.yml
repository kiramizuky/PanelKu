# ─────────────────────────────────────────────────────────────────────
# Panelku — Continuous Integration Pipeline
# Runs on every push and pull request to main/master.
# Stages: Lint → Test (Jest) → Security Audit (npm) → CodeQL SAST
# ─────────────────────────────────────────────────────────────────────

name: CI — Lint, Test & Security Scan

on:
  push:
    branches: [main, master, 'v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  # workflow_call allows this workflow to be used as a reusable workflow by CD
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--experimental-vm-modules'

jobs:
  # ── Stage 1: Lint (ESLint) ──────────────────────────────────────
  lint:
    name: 🔍 Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint:check
        # lint:check exits with error if there are any warnings (--max-warnings 0)

      - name: Check plugin imports resolve
        run: npm run check:plugin-imports
        # [R3] BLOCKER — fails if any plugin imports a path that does not exist
        # (e.g. '../../middleware/auth.js' instead of '../../src/middleware/auth.js'),
        # which would silently prevent the plugin from loading at runtime.

  # ── Stage 2: Unit Tests (Jest) — Node 20, 22 (primary) & 24 LTS ──
  test:
    name: 🧪 Tests (Jest) Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (with build scripts)
        run: npm ci

      - name: Create storage directories
        run: mkdir -p storage/logs storage/uploads storage/backups storage/temp

      - name: Copy .env.example to .env (if exists)
        run: cp -n .env.example .env 2>/dev/null || true

      - name: Run Jest tests
        run: npm test -- --ci --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-only
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci-pipeline-only
          APP_SECRET: test-app-secret-for-ci-pipeline-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-node${{ matrix.node }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ── Stage 2b: Boot Smoke Test ──────────────────────────────────
  # Starts the real server with a clean database and requires /api/health to
  # answer 200 within 90 seconds. This catches bootstrap/import regressions
  # that unit tests do not execute.
  smoke-boot:
    name: 🚀 Boot Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create isolated storage
        run: mkdir -p storage/smoke/logs storage/smoke/uploads storage/smoke/backups storage/smoke/temp

      - name: Boot panel and verify /api/health
        env:
          NODE_ENV: production
          PORT: '34567'
          PANELKU_STORAGE: ${{ github.workspace }}/storage/smoke
          PANELKU_DB_PATH: ${{ github.workspace }}/storage/smoke/panelku.db
          JWT_SECRET: ci-smoke-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-smoke-refresh-secret-not-for-production
          APP_SECRET: ci-smoke-app-secret-not-for-production
          ADMIN_PASSWORD: CiSmokeAdmin!2026
        run: |
          set -euo pipefail
          node src/server.js > /tmp/panelku-smoke.log 2>&1 &
          PANEL_PID=$!
          trap 'kill "$PANEL_PID" 2>/dev/null || true' EXIT

          healthy=0
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:34567/api/health" -o /tmp/panelku-health.json; then
              healthy=1
              break
            fi
            if ! kill -0 "$PANEL_PID" 2>/dev/null; then
              echo "::error::Panel process exited during boot"
              cat /tmp/panelku-smoke.log
              exit 1
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::Panel did not become healthy within 90 seconds"
            cat /tmp/panelku-smoke.log
            exit 1
          fi

          cat /tmp/panelku-health.json
          node -e "
            const fs = require('fs');
            const health = JSON.parse(fs.readFileSync('/tmp/panelku-health.json', 'utf8'));
            if (health.success !== true || health.status !== 'ok') {
              console.error('Unexpected health payload:', health);
              process.exit(1);
            }
            if (!health.redis || typeof health.redis.available !== 'boolean') {
              console.error('Health payload is missing redis status:', health);
              process.exit(1);
            }
            console.log('Boot smoke test passed');
          "

  # ── Stage 3: Window Assignment Check ───────────────────────────
  # Scans all JS files to ensure every `const ModuleName = ...` has a
  # matching `window.ModuleName = ModuleName;` assignment. Prevents
  # "xxx.yyy not a function" errors caused by const not being on window.
  window-check:
    name: Window Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run window assignment check
        run: node scripts/check-window-assignment.js

  # ── Stage 4: Dependency Audit (npm audit) ───────────────────────
  audit:
    name: Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=high
        # [R1] BLOCKER — exits with code 1 if any high/critical vulnerability is found.
        # Do NOT set continue-on-error here; vulnerabilities must be fixed before merge.
        continue-on-error: false

  # ── Stage 4: CodeQL SAST Analysis ───────────────────────────────
  codeql:
    name: 🔬 CodeQL SAST (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: +security-and-quality

      - name: Build project (none required for Node.js)
        run: echo "No build step required for JavaScript/Node.js"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ── Stage 5: Build Gate (ESLint + Custom Rules) ─────────────────
  # The ESLint custom rule `require-window-export` runs as part of
  # `npm run lint:check` in the `lint` job (via eslint.config.js).
  build-check:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, window-check, audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: panelku:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max
